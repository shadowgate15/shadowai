[package]
name = "shadowai-agent-ui-ipc"
version = "0.1.0"
edition = "2024"

[dependencies]
rig = { workspace = true, optional = true }
serde = { workspace = true, features = ["derive"] }
tokio = { workspace = true, features = ["sync"] }
tracing = { workspace = true, optional = true }

[features]
default = []
hook = ["dep:rig", "dep:tracing"]
