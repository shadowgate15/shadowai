[workspace]
members = [
  "crates/shadowai-agent",
  "crates/shadowai-filesystem",
  "crates/shadowai-shell",
  "crates/shadowai-tools",
  "crates/shadowai-agent-ui-ipc",
]

[package]
name = "shadowai"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow.workspace = true
directories = "6.0.0"
shadowai-agent.workspace = true
shadowai-filesystem.workspace = true
shadowai-shell.workspace = true
shadowai-tools.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = [
  "env-filter",
  "time",
  "local-time",
] }
shadowai-agent-ui-ipc.workspace = true
dialoguer = "0.12.0"
rig.workspace = true
serde_json.workspace = true

[workspace.dependencies]
shadowai-agent = { path = "crates/shadowai-agent" }
shadowai-filesystem = { path = "crates/shadowai-filesystem" }
shadowai-shell = { path = "crates/shadowai-shell" }
shadowai-tools = { path = "crates/shadowai-tools" }
shadowai-agent-ui-ipc = { path = "crates/shadowai-agent-ui-ipc" }

anyhow = "1.0.104"
fetchkit = "0.5.0"
futures = "0.3.33"
globwalk = "0.9.1"
rig = "0.41.0"
schemars = "1.2.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
test_dir = "0.2.0"
thiserror = "2.0.19"
tokio = "1.53.1"
tokio-stream = "0.1.19"
tokio-util = "0.7.19"
tracing = "0.1.44"
websearch = "0.1.1"
